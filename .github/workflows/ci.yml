name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fe6c359756c557903cf20f6b1fcbab30d40243d5 # v3.0.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdeb5c3 # v4.1.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Extension
        run: pnpm build

      - name: Run Vitest Unit Tests
        run: pnpm test

      - name: Install Playwright Browsers & System Dependencies
        run: pnpm --dir apps/extension-e2e exec playwright install chromium --with-deps

      - name: Run Playwright E2E Tests (Headed via Xvfb)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" pnpm --dir apps/extension-e2e exec playwright test

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@60a1915c8922c80c2dd787f31f7f986a063406c1 # v4.3.6
        with:
          name: playwright-report
          path: apps/extension-e2e/playwright-report/
          retention-days: 14
